[project]
name = "lerobot-openarm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[dataset,groot,training,viz]",
    "matplotlib>=3.10.8",
    "openarm-can>=1.2.3",
    "pin",
    "python-dotenv>=1.2.1",
    "deepdiff>=8.0.0",
    "num2words>=0.5.14",
    # Official lerobot-record / lerobot-rollout plugins (plugins/README.md).
    "lerobot_robot_openarm_umeow",
    "lerobot_teleoperator_openarm_quest",
    # The Quest teleop's IK, pinned to what the dora pipeline's ik node runs.
    "openarm_control",
    "openarm-mujoco==2.1.0",
    "mink==1.1.0",
    "mujoco==3.11.0",
    "scipy",
]

[dependency-groups]
dev = [
    "pybind11-stubgen>=2.5.5",
]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", branch = "main" }
lerobot_robot_openarm_umeow = { path = "plugins/lerobot_robot_openarm_umeow", editable = true }
lerobot_teleoperator_openarm_quest = { path = "plugins/lerobot_teleoperator_openarm_quest", editable = true }
openarm_control = { git = "https://github.com/enactic/openarm_control", rev = "2f1ee56ef2bf1272329b213a1f0b0768b9d07f2b" }
