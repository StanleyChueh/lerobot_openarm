# OpenArm wrist cameras (shared by every OpenArm task config via `wrist_cameras_model: _openarm_wrist_cameras.yaml`).
# Camera pose = FK(parent_frame) . X, ROS optical axes (z forward, x right, y down), at state time = video frame + lag.
# X and lag: v3_2 adopted calibration (research/sim_free_augmentation/v3_2/outputs/calibration/wrist_calibration.json):
#   rotation + translation from the held-out-validated can-silhouette fits (consistency calibration, NOT a ChArUco
#   extrinsic); lags from the mount-independent rotation-magnitude scan.
# Intrinsics: measured with `rs-enumerate-devices -c` (v3_2/sfa32/wristcam.py).
